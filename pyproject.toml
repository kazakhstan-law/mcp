[project]
name = "kazakhstan-law-mcp"
version = "0.1.0"
description = "Remote MCP server over the kazakhstan-law git corpus"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["fastmcp>=4.0.10,<5", "pyyaml>=6.0"]

[project.scripts]
kzlaw-mcp = "kzlaw_mcp.server:main"
kzlaw-refresh = "kzlaw_mcp.refresh:main"
kzlaw-report = "kzlaw_mcp.report:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kzlaw_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["reference: real questions through claude -p against a live server (costs quota)"]
addopts = "-m 'not reference'"

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
extend-select = ["ANN"]   # annotation presence; ty measures resolution
ignore = ["ANN401"]       # explicit Any is allowed where deliberate

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["kzlaw_mcp", "conftest"]

[tool.ty.environment]
python-version = "3.13"
python = "./.venv"
root = ["./src"]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["**/__pycache__", "build", "dist"]
respect-ignore-files = true

[tool.ty.terminal]
error-on-warning = false  # flip to true once clean
